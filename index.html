      height: 100%;

      color: #f8f5ee;
      font-family: 'Plus Jakarta Sans', sans-serif;
      user-select: none;

    #threejs-mall-viewport {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      cursor: grab;
    }
    #threejs-mall-viewport:active {
      cursor: grabbing;
    }

    .palace-glass {

      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(214, 167, 92, 0.3);

      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(214, 167, 92, 0.45);

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .gold-btn {
      background: linear-gradient(135deg, #f5e4b7 0%, #d6a75c 50%, #b8893d 100%);
      color: #040b15;
      font-weight: 700;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .gold-btn:hover {
      box-shadow: 0 0 25px rgba(214, 167, 92, 0.6);
      transform: translateY(-2px);
    }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: rgba(3, 14, 32, 0.6); }
    ::-webkit-scrollbar-thumb { background: rgba(214, 167, 92, 0.4); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(214, 167, 92, 0.8); }
